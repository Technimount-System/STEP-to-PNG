services:
  step-to-png:
    build: .
    ports:
      - "10000:10000"
    env_file: .env
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python3", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:10000/')"]
      interval: 30s
      timeout: 5s
      retries: 3
